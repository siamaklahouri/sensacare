name = "sensa"
main = "src/index.js"
compatibility_date = "2025-01-01"

# فایل‌های سایت (index.html)
# هشدار: این خط باید بالاتر از هر [بخش] بماند. در TOML هر کلیدی که
# بعد از یک [بخش] بیاید داخل همان بخش حساب می‌شود، نه در سطح اصلی.
# «run_worker_first» برای «/»: فایل‌های ثابت پیش از ورکر سرو می‌شوند،
# پس بدون این، ریشه روی دامنهٔ پنل هم همان index.html فروشگاه می‌شد و
# اصلاً به کد نمی‌رسید تا به صفحهٔ ورود برود.
assets = { directory = "./public", binding = "ASSETS", run_worker_first = ["/", "/index.html"] }

# هوش مصنوعی کلادفلر — برای دستیار فروشگاه.
# کلیدی لازم ندارد؛ درخواست از خودِ ورکر می‌رود، نه از مرورگر مشتری.
# قالب‌ها به‌صورتِ متن داخلِ باندل می‌آیند (src/templates.js).
# فقط فایلی که واقعاً import شود داخل می‌رود، نه همهٔ .tpl ها.
rules = [
  { type = "Text", globs = ["**/*.tpl"] }
]

[ai]
binding = "AI"

# دیتابیس — database_id را از خروجی دستور ساخت D1 اینجا بگذارید
[[d1_databases]]
binding = "DB"
database_name = "sensa-db"
database_id = "355c3dc4-a312-4eab-ab0a-14cff6f669f6"

[vars]
ADMIN_USER = "admin"
# آی‌دی ربات‌ها (راز نیستند) — برای ساختن لینک «ورود با تلگرام»
TELEGRAM_BOT_USER = "sensacare_bot"
BALE_BOT_USER = "sensacare_bot"
# دامنه‌ای که وب‌هوک ربات روی آن ثبت می‌شود (فروشگاه)
PUBLIC_HOST = "sensacare.ir"
# دو سایتِ جدا روی همین یک ورکر. میزبانی که این‌جا نباشد — localhost،
# *.workers.dev، پیش‌نمایش‌ها — هر دو را سرو می‌کند.
SHOP_HOST = "sensacare.ir"
# تا وقتی این خالی است هیچ تقسیمی انجام نمی‌شود و همه‌چیز مثل قبل روی
# sensacare.ir کار می‌کند. اول دامنه را در کلادفلر به همین ورکر وصل
# کنید (Workers → Settings → Domains & Routes → Add Custom Domain)،
# بعد این را پر کنید و دوباره منتشر کنید. برعکسش یعنی کارتابل‌ها روی
# دامنه‌ای ۳۰۱ می‌خورند که هنوز جواب نمی‌دهد.
PANEL_HOST = "sltech.ir"
# رمز و کلیدها را با دستور secret بگذارید، نه اینجا:
#   npx wrangler secret put ADMIN_PASS
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put SMS_PROVIDER
#   npx wrangler secret put SMS_API_KEY
#   npx wrangler secret put SMS_TEMPLATE

# ربات‌ها با دستور  npm run bots  تنظیم می‌شوند

# پشتیبان خودکار — دو بار در روز، به وقت گرینویچ نوشته می‌شود:
#   ۰۸:۳۰ گرینویچ = ۱۲:۰۰ ظهرِ تهران
#   ۲۲:۰۰ گرینویچ = ۱:۳۰ بامدادِ تهران
# کارهای دیگرِ شبانه فقط در نوبت دوم اجرا می‌شوند (قفلشان روزانه است).
[triggers]
# چهار نوبت پشتیبان در شبانه‌روز، هر شش ساعت. به وقتِ گرینویچ نوشته
# شده‌اند؛ تهران ۳:۳۰ جلوتر است، پس این‌ها یعنی ۶ و ۱۲ و ۱۸ و ۲۴ تهران.
# کارهای روزانهٔ دیگر (پشتیبانِ فروشگاه، یادآوری‌ها) با claimOnce روزی
# یک بار قفل می‌شوند، پس این فراخوانی‌های بیشتر تکرارشان نمی‌کند.
crons = ["30 2 * * *", "30 8 * * *", "30 14 * * *", "30 20 * * *"]
