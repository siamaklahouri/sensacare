# استقرار خودکار سِنسا روی Cloudflare Workers
# هر بار که روی گیت‌هاب چیزی تغییر کند، سایت خودش به‌روز می‌شود.
#
# قبلش در GitHub → Settings → Secrets and variables → Actions
# این دو تا را بسازید:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# و اگر خواستید، این‌ها را هم:
#   ADMIN_PASS, JWT_SECRET, D1_DATABASE_ID,
#   SMS_PROVIDER, SMS_API_KEY, SMS_TEMPLATE,
#   TELEGRAM_BOT_TOKEN, BALE_BOT_TOKEN, BOT_SECRET

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/health-products-cloudflare-worker-5z2moc
  workflow_dispatch:

# یک استقرار در هر لحظه، و اگر اجرایی در صف مانده بود لغو شود.
# بدون این، اجرای قدیمی‌ای که ساعت‌ها در صفِ گیت‌هاب مانده می‌تواند بعد از
# اجرای تازه تمام شود و نسخهٔ قدیمی را روی نسخهٔ جدید بنویسد — دقیقاً همین
# یک‌بار اتفاق افتاد. اجرای در حالِ استقرار لغو نمی‌شود تا وسط کار نماند.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # نسخهٔ v4 روی Node 20 اجرا می‌شد که گیت‌هاب بازنشسته‌اش کرده و هر اجرا
      # یک هشدار می‌داد. v7 روی Node 24 است.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # از v5 به بعد کشِ وابستگی‌ها خودبه‌خود روشن است. خودِ اکشن توصیه
          # می‌کند در workflowهایی که به رازها دسترسی دارند خاموشش کنید —
          # اینجا دوازده راز رد می‌شود، از توکن کلادفلر تا رمز مدیر.
          package-manager-cache: false

      - name: نصب ابزارها
        run: npm install --no-audit --no-fund

      - name: بررسی اینکه رازها رسیده‌اند یا نه
        env:
          SECRET_NAMES: ${{ toJSON(secrets) }}
        run: |
          echo "نام رازهایی که به این اجرا رسیده‌اند:"
          echo "$SECRET_NAMES" | grep -o '"[A-Za-z0-9_]*":' | tr -d '":' | sort
          echo "---"
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::رازی به اسم دقیقاً CLOUDFLARE_API_TOKEN پیدا نشد."
          fi

      - name: استقرار
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID:        ${{ secrets.D1_DATABASE_ID }}
          ADMIN_USER:            ${{ vars.ADMIN_USER }}
          ADMIN_PASS:            ${{ secrets.ADMIN_PASS }}
          JWT_SECRET:            ${{ secrets.JWT_SECRET }}
          SMS_PROVIDER:          ${{ secrets.SMS_PROVIDER }}
          SMS_API_KEY:           ${{ secrets.SMS_API_KEY }}
          SMS_TEMPLATE:          ${{ secrets.SMS_TEMPLATE }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BALE_BOT_TOKEN:        ${{ secrets.BALE_BOT_TOKEN }}
          BOT_SECRET:            ${{ secrets.BOT_SECRET }}
        run: npm run deploy
