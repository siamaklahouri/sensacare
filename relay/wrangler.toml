# رلهٔ تلگرام — یک ورکرِ کوچک و جدا از سایت.
#
# چرا جداست و داخلِ ورکرِ اصلی نرفت: ورکرِ اصلی سایتِ sensacare.ir را
# سرو می‌کند و قرار است دست نخورد. این هم چیزی از آن نمی‌خواهد.
#
# استقرار:
#   cd relay
#   npx wrangler deploy
#   npx wrangler secret put RELAY_SECRET      # رمز را همان‌جا پیست کنید
#
# RELAY_SECRET هیچ‌وقت داخلِ این فایل نوشته نمی‌شود؛ secret است، نه var.

name = "sltech-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

# دو آدرس، نه یکی:
#
# tg.sltech.ir زیردامنهٔ خودمان است و به workers.dev وابسته نیست —
# workers.dev آدرسِ مشترکِ همهٔ ورکرهاست و هر وقت جایی فیلتر شود، رلهٔ
# ما هم با آن می‌رود.
#
# ولی رکوردِ DNS زیردامنهٔ سفارشی گاهی دیر ساخته می‌شود، و تا آن موقع
# رله در دسترس نیست. پس آدرسِ workers.dev هم باز می‌ماند تا راهِ دومی
# باشد که به DNS زون کاری ندارد.
workers_dev = true

[[routes]]
pattern = "tg.sltech.ir"
custom_domain = true

[observability]
enabled = true

[vars]
# جایی که وب‌هوکِ تلگرام باید به آن برسد — سایتِ روی سرورِ ایران.
# تا وقتی دامنه جابه‌جا نشده، زیردامنهٔ آزمایشی این‌جا می‌نشیند.
ORIGIN = "https://new.sltech.ir"
