# ==================================================================
# ورودیِ sensacare.ir روی همان سرور
#
# دو سایت، یک سرور، یک nginx. چیزی که از هم جدایشان می‌کند نامِ
# دامنه است: این فایل به ۸۷۸۸ می‌رود و فایلِ sltech به ۸۷۸۷، و آن دو
# پورت دو سرویسِ جدا با دو دیتابیسِ جدا هستند.
#
# nginx نسخهٔ ۱.۲۴ است و «http2 on;» را نمی‌شناسد.
#
# فقط IPv4، مثل آن یکی: sensacare.ir رکوردِ A می‌گیرد و بس.
# ==================================================================

upstream sensa_app {
    server 127.0.0.1:8788;
    keepalive 16;
}

# ---- نامِ ناشناس: هیچ ----
#
# در nginx اگر هیچ بلوکی default_server نباشد، اولین بلوکِ آن پورت
# این نقش را می‌گیرد. ترتیبِ include الفبایی است، پس اولین بلوکِ ۴۴۳
# در کلِ سرور بلوکِ www.sensacare.ir بود و هر نامِ ناشناسی ۳۰۱ به
# فروشگاه می‌گرفت. دو عارضه داشت: هر کسی دامنه‌اش را به این آی‌پی
# می‌گرفت سر از فروشگاه در می‌آورد، و بدتر، چکِ «۳۰۱ گرفتیم» در
# اسکریپتِ استقرار از همین بلوک ۳۰۱ می‌گرفت و به دلیلِ غلط سبز
# می‌شد — یک بار هم همین، سایتِ سالم را «خراب» اعلام کرد.
#
# پس default_server را صریح می‌نویسیم و جوابش ۴۴۴ است: بستنِ اتصال
# بی هیچ پاسخی. از این به بعد فقط نام‌های شناخته‌شده جواب می‌گیرند.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    # TLS پیش از دیدنِ نامِ میزبان برقرار می‌شود، پس این بلوک هم
    # گواهی می‌خواهد. هر کدام؛ کسی اعتبارش را نمی‌سنجد.
    ssl_certificate     /etc/letsencrypt/live/sensacare.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensacare.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 444;
}

# ---- ۸۰: اجازه‌نامهٔ ACME و بردن به https ----
server {
    listen 80;
    server_name sensacare.ir www.sensacare.ir new.sensacare.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

# ---- www → بدونِ www ----
server {
    listen 443 ssl http2;
    server_name www.sensacare.ir;

    ssl_certificate     /etc/letsencrypt/live/sensacare.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensacare.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SNTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://sensacare.ir$request_uri;
}

# ---- خودِ فروشگاه ----
server {
    listen 443 ssl http2;
    server_name sensacare.ir new.sensacare.ir;

    ssl_certificate     /etc/letsencrypt/live/sensacare.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensacare.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SNTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # مشتری عکسِ فیشِ پرداخت را آپلود می‌کند.
    client_max_body_size 25m;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml
               application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://sensa_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
