# ==================================================================
# ورودیِ sltech.ir روی سرورِ خودمان
#
# این فایل جایگزینِ /etc/nginx/sites-available/sltech می‌شود. تا پیش
# از جابه‌جایی فقط new.sltech.ir از این‌جا سرو می‌شد؛ حالا خودِ
# sltech.ir و www هم اضافه شده‌اند.
#
# nginx نسخهٔ ۱.۲۴ است و «http2 on;» را نمی‌شناسد — آن دستور از ۱.۲۵
# به بعد آمده. پس همان شکلِ قدیمی: «listen ... http2».
#
# نامِ پروندهٔ گواهی «new.sltech.ir» است چون همان گواهیِ قبلی گسترش
# داده شد تا هر سه نام را بپوشاند. اسمِ پوشه است و بس؛ کاربر چیزی
# از آن نمی‌بیند.
# ==================================================================

upstream sltech_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

# ---- ۸۰: فقط اجازه‌نامهٔ ACME و بردن به https ----
server {
    listen 80;
    listen [::]:80;
    server_name sltech.ir www.sltech.ir new.sltech.ir;

    # گواهی با روشِ DNS گرفته می‌شود و این مسیر لازم نیست؛ ولی اگر
    # روزی به روشِ فایلی برگشتیم، همین‌جا آماده است.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

# ---- www → بدونِ www ----
# کدِ سایت خودش www را نادیده می‌گیرد، ولی یک آدرسِ واحد برای
# کوکی‌ها و برای گوگل بهتر است.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sltech.ir;

    ssl_certificate     /etc/letsencrypt/live/new.sltech.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.sltech.ir/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sltech.ir$request_uri;
}

# ---- خودِ سایت ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sltech.ir new.sltech.ir;

    ssl_certificate     /etc/letsencrypt/live/new.sltech.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.sltech.ir/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # پشتیبانِ کارتابل زیپ می‌فرستد و عکسِ پروفایل هم بالا می‌آید.
    client_max_body_size 25m;

    # گزارش‌ساز روی جدولِ بزرگ کمی طول می‌کشد.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # برنامه فشرده نمی‌کند؛ nginx می‌کند.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://sltech_app;
        proxy_http_version 1.1;

        # Host دست‌نخورده رد می‌شود: خودِ برنامه از روی آن تصمیم
        # می‌گیرد کارتابل را نشان بدهد یا فروشگاه را.
        proxy_set_header Host              $host;

        # بدونِ این، محدودیتِ تعدادِ تلاشِ ورود همهٔ کاربران را در یک
        # سطل می‌ریخت: کدِ سایت نشانیِ کاربر را از همین هدر می‌خواند
        # و روی سرورِ خودمان هدرِ کلادفلر دیگر نمی‌آید.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # و بدونِ این، کوکیِ Secure روی درخواستی که برنامه http
        # می‌پنداشت صادر نمی‌شد و ورود حلقه می‌خورد.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection        "";
        proxy_buffering off;
    }
}
